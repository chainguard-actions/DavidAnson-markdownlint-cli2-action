name: Test basic usage with valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint-cli2 on valid markdown fixture
        id: action
        uses: .
        with:
          globs: "tests/fixtures/valid.md"
          config: "tests/fixtures/config-permissive.json"

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully on valid markdown"
          echo "PASS"
