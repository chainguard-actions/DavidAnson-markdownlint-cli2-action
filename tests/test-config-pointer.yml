name: Test configPointer input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # NOTE: the repository root .markdownlint.json overrides rule settings from
      # --config, so the nested object uses the "ignores" option instead.
      - name: Create files and nested config
        run: |
          mkdir -p lint-pointer/docs lint-pointer/cfg
          printf '# Good\n\nSome text.\n' > lint-pointer/docs/good.md
          printf 'Just some text.\n' > lint-pointer/docs/noheading.md
          printf '{\n  "nested": {\n    "ignores": ["lint-pointer/docs/noheading.md"]\n  }\n}\n' > lint-pointer/cfg/.markdownlint-cli2.jsonc
      - id: baseline
        uses: .
        continue-on-error: true
        with:
          globs: lint-pointer/docs/*.md
          config: lint-pointer/cfg/.markdownlint-cli2.jsonc
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-pointer/docs/*.md
          config: lint-pointer/cfg/.markdownlint-cli2.jsonc
          configPointer: /nested
      - name: Assert pointer config took effect
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "baseline: $BASELINE outcome: $OUTCOME"
          if [ "$BASELINE" != "failure" ]; then
            echo "FAIL: expected failure without configPointer (top-level has no ignores)"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with bad file ignored via configPointer"
            exit 1
          fi
          echo "PASS"
