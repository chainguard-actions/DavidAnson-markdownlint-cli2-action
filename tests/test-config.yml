name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # NOTE: the repository root contains a .markdownlint.json, which takes
      # precedence over rule settings ("config") supplied via --config. So the
      # base config here is a markdownlint-cli2 options file using "ignores",
      # an option the root rule-config file does not override.
      - name: Create files and config
        run: |
          mkdir -p lint-config/docs lint-config/cfg
          printf '# Good\n\nSome text.\n' > lint-config/docs/good.md
          # Missing top-level heading violates MD041 (first-line-heading)
          printf 'Just some text.\n' > lint-config/docs/noheading.md
          printf '{\n  "ignores": ["lint-config/docs/noheading.md"]\n}\n' > lint-config/cfg/.markdownlint-cli2.jsonc
      - id: baseline
        uses: .
        continue-on-error: true
        with:
          globs: lint-config/docs/*.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-config/docs/*.md
          config: lint-config/cfg/.markdownlint-cli2.jsonc
      - name: Assert config took effect
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "baseline: $BASELINE outcome: $OUTCOME"
          if [ "$BASELINE" != "failure" ]; then
            echo "FAIL: expected baseline (no config) to fail on MD041"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with bad file ignored via config"
            exit 1
          fi
          echo "PASS"
