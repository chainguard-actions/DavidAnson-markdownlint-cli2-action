name: Test with custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint-cli2 with custom config (MD041 disabled, should pass)
        id: action
        uses: .
        with:
          globs: "tests/fixtures/no-heading-start.md"
          config: "tests/fixtures/config-no-md041.json"

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom config"
          echo "PASS: MD041 was disabled via config and lint passed"
