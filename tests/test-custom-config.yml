name: Test custom config - disable specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint-cli2-action with custom permissive config
        id: action
        uses: .
        with:
          globs: tests/fixtures/trailing-spaces.md
          config: tests/fixtures/config-permissive.json

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom config"
          echo "PASS"
