name: Test fix mode auto-fixes supported issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show markdown file before fix
        run: |
          echo "Before fix:"
          cat -A "$GITHUB_WORKSPACE/tests/fixtures/trailing-spaces.md"

      - name: Run markdownlint-cli2 with fix enabled
        id: action
        uses: .
        with:
          globs: "tests/fixtures/trailing-spaces.md"
          config: "tests/fixtures/config-fix-mode.json"
          fix: "true"

      - name: Assert fix mode ran successfully
        run: |
          echo "After fix:"
          cat -A "$GITHUB_WORKSPACE/tests/fixtures/trailing-spaces.md"
          echo "PASS: fix mode completed without error"
