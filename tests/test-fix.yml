name: Test fix mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixable file
        run: |
          mkdir -p lint-fix
          printf '# Title\n\nSome text here.   \n\n\n\nMore text.\n' > lint-fix/fixme.md
          cat -A lint-fix/fixme.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-fix/*.md
          fix: 'true'
      - name: Assert fixed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat -A lint-fix/fixme.md
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success after fixing"
            exit 1
          fi
          if grep -qE ' +$' lint-fix/fixme.md; then
            echo "FAIL: trailing spaces not removed"
            exit 1
          fi
          if [ "$(grep -c '^$' lint-fix/fixme.md)" -ne 2 ]; then
            echo "FAIL: multiple blank lines not collapsed"
            exit 1
          fi
          echo "PASS"
