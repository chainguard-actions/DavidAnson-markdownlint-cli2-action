name: Test lint errors fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create invalid file
        run: |
          mkdir -p lint-bad
          printf 'No heading here.   \n\n\n\n#Bad heading\n' > lint-bad/bad.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-bad/*.md
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for lint errors"
            exit 1
          fi
          echo "PASS"
