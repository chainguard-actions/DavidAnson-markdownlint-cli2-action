name: Test lint failure - invalid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint-cli2-action on fixture with trailing spaces
        id: action
        uses: .
        with:
          globs: tests/fixtures/fail/trailing-spaces.md
        continue-on-error: true

      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to lint errors, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on markdown with trailing spaces"
