name: Test lint failure - invalid markdown fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid markdown file with known lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-lint-failure"
          # MD022: Headings should be surrounded by blank lines
          # MD041: First line should be a top-level heading
          printf 'some text\n# Heading without blank lines\nmore text\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-lint-failure/invalid.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: "tests/tmp-lint-failure/invalid.md"

      - name: Assert action failed (invalid markdown should fail linting)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid markdown"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on invalid markdown but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
