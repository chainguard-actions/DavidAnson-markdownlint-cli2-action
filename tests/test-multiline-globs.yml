name: Test multiline globs with negation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files
        run: |
          mkdir -p lint-multi
          printf '# Title\n\nSome text here.\n' > lint-multi/good.md
          printf '#Bad heading\n' > lint-multi/bad.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: |
            lint-multi/*.md
            !lint-multi/bad.md
      - name: Assert negated file excluded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with bad file excluded"
            exit 1
          fi
          echo "PASS"
