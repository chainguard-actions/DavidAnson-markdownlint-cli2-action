name: Test custom separator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files
        run: |
          mkdir -p lint-sep/a lint-sep/b
          printf '# Title\n\nSome text here.\n' > lint-sep/a/good.md
          printf '#Bad heading\n' > lint-sep/b/bad.md
      - id: good
        uses: .
        continue-on-error: true
        with:
          globs: lint-sep/a/*.md,lint-sep/a/good.md
          separator: ','
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-sep/a/*.md,lint-sep/b/*.md
          separator: ','
      - name: Assert separator splits globs
        env:
          GOOD: ${{ steps.good.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "good: $GOOD outcome: $OUTCOME"
          if [ "$GOOD" != "success" ]; then
            echo "FAIL: expected good-only globs to succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because second glob includes bad file"
            exit 1
          fi
          echo "PASS"
