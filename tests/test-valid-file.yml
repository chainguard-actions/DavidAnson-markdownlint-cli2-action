name: Test valid file passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create valid file
        run: |
          mkdir -p lint-valid
          printf '# Title\n\nSome text here.\n' > lint-valid/good.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          globs: lint-valid/*.md
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
